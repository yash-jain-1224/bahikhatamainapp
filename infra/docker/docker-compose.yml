version: '3.9'

services:
  # ==========================================================================
  # Infrastructure Services
  # ==========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: bahi-khata-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bahi_khata_pro
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bahi-khata-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================================================
  # API Gateway
  # ==========================================================================
  api-gateway:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE_NAME: api-gateway
    container_name: bahi-khata-gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - API_GATEWAY_PORT=3000
      - CORS_ORIGIN=*
      - AUTH_SERVICE_URL=http://auth-service:3001
      - BUSINESS_SERVICE_URL=http://business-service:3002
      - PURCHASE_SERVICE_URL=http://purchase-service:3003
      - SALES_SERVICE_URL=http://sales-service:3004
      - INVENTORY_SERVICE_URL=http://inventory-service:3005
      - LEDGER_SERVICE_URL=http://ledger-service:3006
      - SUBSCRIPTION_SERVICE_URL=http://subscription-service:3007
      - BILLING_SERVICE_URL=http://billing-service:3008
      - NOTIFICATION_SERVICE_URL=http://notification-service:3009
      - ADMIN_SERVICE_URL=http://admin-service:3010
      - PROFILE_SERVICE_URL=http://profile-service:3011
      - REFERRAL_SERVICE_URL=http://referral-service:3012
    depends_on:
      - auth-service
      - business-service
      - purchase-service
      - sales-service
      - inventory-service
      - ledger-service
      - subscription-service
      - billing-service
      - notification-service
      - admin-service
      - profile-service
      - referral-service

  # ==========================================================================
  # Microservices
  # ==========================================================================
  auth-service:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE_NAME: auth-service
    container_name: bahi-khata-auth
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - AUTH_SERVICE_PORT=3001
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/bahi_khata_pro
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  business-service:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE_NAME: business-service
    container_name: bahi-khata-business
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - BUSINESS_SERVICE_PORT=3002
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/bahi_khata_pro
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy

  purchase-service:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE_NAME: purchase-service
    container_name: bahi-khata-purchase
    restart: unless-stopped
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=production
      - PURCHASE_SERVICE_PORT=3003
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/bahi_khata_pro
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy

  sales-service:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE_NAME: sales-service
    container_name: bahi-khata-sales
    restart: unless-stopped
    ports:
      - "3004:3004"
    environment:
      - NODE_ENV=production
      - SALES_SERVICE_PORT=3004
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/bahi_khata_pro
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy

  inventory-service:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE_NAME: inventory-service
    container_name: bahi-khata-inventory
    restart: unless-stopped
    ports:
      - "3005:3005"
    environment:
      - NODE_ENV=production
      - INVENTORY_SERVICE_PORT=3005
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/bahi_khata_pro
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy

  ledger-service:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE_NAME: ledger-service
    container_name: bahi-khata-ledger
    restart: unless-stopped
    ports:
      - "3006:3006"
    environment:
      - NODE_ENV=production
      - LEDGER_SERVICE_PORT=3006
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/bahi_khata_pro
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy

  subscription-service:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE_NAME: subscription-service
    container_name: bahi-khata-subscription
    restart: unless-stopped
    ports:
      - "3007:3007"
    environment:
      - NODE_ENV=production
      - SUBSCRIPTION_SERVICE_PORT=3007
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/bahi_khata_pro
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET}
    depends_on:
      postgres:
        condition: service_healthy

  billing-service:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE_NAME: billing-service
    container_name: bahi-khata-billing
    restart: unless-stopped
    ports:
      - "3008:3008"
    environment:
      - NODE_ENV=production
      - BILLING_SERVICE_PORT=3008
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/bahi_khata_pro
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy

  notification-service:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE_NAME: notification-service
    container_name: bahi-khata-notification
    restart: unless-stopped
    ports:
      - "3009:3009"
    environment:
      - NODE_ENV=production
      - NOTIFICATION_SERVICE_PORT=3009
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/bahi_khata_pro
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - WHATSAPP_API_URL=${WHATSAPP_API_URL}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID}
      - WHATSAPP_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN}
      - WHATSAPP_VERIFY_TOKEN=${WHATSAPP_VERIFY_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy

  admin-service:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE_NAME: admin-service
    container_name: bahi-khata-admin
    restart: unless-stopped
    ports:
      - "3010:3010"
    environment:
      - NODE_ENV=production
      - ADMIN_SERVICE_PORT=3010
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/bahi_khata_pro
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy

  profile-service:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE_NAME: profile-service
    container_name: bahi-khata-profile
    restart: unless-stopped
    ports:
      - "3011:3011"
    environment:
      - NODE_ENV=production
      - PROFILE_SERVICE_PORT=3011
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/bahi_khata_pro
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy

  referral-service:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE_NAME: referral-service
    container_name: bahi-khata-referral
    restart: unless-stopped
    ports:
      - "3012:3012"
    environment:
      - NODE_ENV=production
      - REFERRAL_SERVICE_PORT=3012
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/bahi_khata_pro
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy

  # ==========================================================================
  # Frontend (App)
  # ==========================================================================
  frontend:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.frontend
    container_name: bahi-khata-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api-gateway

  # ==========================================================================
  # Website (Marketing)
  # ==========================================================================
  website:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.website
    container_name: bahi-khata-website
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api-gateway

volumes:
  postgres-data:
  redis-data:

networks:
  default:
    name: bahi-khata-network
