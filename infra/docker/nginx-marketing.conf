# Marketing site nginx config — serves the standalone website project (website/)
# Build output: website/dist
# Optimized for SEO and performance

server {
    listen 80;
    server_name bahikhata.pro www.bahikhata.pro;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.bahikhata.pro;" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Brotli compression (if module available)
    # brotli on;
    # brotli_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Static assets — long cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Translation files — cache for 1 hour
    location /locales/ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        try_files $uri =404;
    }

    # SEO files
    location = /sitemap.xml {
        expires 1d;
        add_header Content-Type "application/xml; charset=utf-8";
    }

    location = /robots.txt {
        expires 1d;
        add_header Content-Type "text/plain; charset=utf-8";
    }

    # API proxy
    location /api/ {
        proxy_pass http://api-gateway:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Language-prefixed routes — SPA fallback
    location ~ ^/(en|hi|gu|mr|ta|te|kn|ml|pa|bn|or)(/.*)?$ {
        try_files $uri $uri/ /index.html;
    }

    # App routes — SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
