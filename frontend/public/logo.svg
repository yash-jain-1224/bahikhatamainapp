<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="128" y1="180" x2="384" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
  </defs>
  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="96" fill="url(#logoGrad)"/>
  <!-- Inner shadow/glow -->
  <rect x="32" y="32" width="448" height="448" rx="72" fill="white" fill-opacity="0.08"/>
  <!-- Letter B -->
  <text x="256" y="340" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="280" fill="url(#textGrad)">B</text>
  <!-- Accent dot -->
  <circle cx="400" cy="400" r="40" fill="#34D399"/>
  <circle cx="400" cy="400" r="28" fill="#10B981"/>
  <!-- Small ledger lines -->
  <line x1="100" y1="420" x2="280" y2="420" stroke="white" stroke-opacity="0.3" stroke-width="4" stroke-linecap="round"/>
  <line x1="100" y1="440" x2="240" y2="440" stroke="white" stroke-opacity="0.2" stroke-width="3" stroke-linecap="round"/>
  <line x1="100" y1="458" x2="200" y2="458" stroke="white" stroke-opacity="0.15" stroke-width="2" stroke-linecap="round"/>
</svg>
