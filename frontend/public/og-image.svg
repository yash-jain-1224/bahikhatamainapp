<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="600" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <!-- Decorative circles -->
  <circle cx="200" cy="300" r="250" fill="#2563EB" fill-opacity="0.08"/>
  <circle cx="1000" cy="400" r="300" fill="#10B981" fill-opacity="0.06"/>
  <!-- Logo icon -->
  <rect x="80" y="200" width="100" height="100" rx="22" fill="url(#accentGrad)"/>
  <text x="130" y="275" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="56" fill="white">B</text>
  <circle cx="172" cy="292" r="12" fill="#34D399"/>
  <!-- Brand text -->
  <text x="210" y="262" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="52" fill="white">Bahi Khata</text>
  <text x="210" y="290" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="16" fill="#94A3B8" letter-spacing="6">PRO</text>
  <!-- Tagline -->
  <text x="80" y="380" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="36" fill="white">India's #1 Industry-Ready</text>
  <text x="80" y="430" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="36" fill="url(#accentGrad)">ERP SaaS Platform</text>
  <!-- Features pills -->
  <rect x="80" y="470" width="140" height="36" rx="18" fill="#2563EB" fill-opacity="0.2"/>
  <text x="150" y="494" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="14" fill="#60A5FA">Purchases</text>
  <rect x="235" y="470" width="100" height="36" rx="18" fill="#10B981" fill-opacity="0.2"/>
  <text x="285" y="494" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="14" fill="#34D399">Sales</text>
  <rect x="350" y="470" width="130" height="36" rx="18" fill="#8B5CF6" fill-opacity="0.2"/>
  <text x="415" y="494" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="14" fill="#A78BFA">Inventory</text>
  <rect x="495" y="470" width="120" height="36" rx="18" fill="#F59E0B" fill-opacity="0.2"/>
  <text x="555" y="494" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="14" fill="#FBBF24">Ledger</text>
  <rect x="630" y="470" width="100" height="36" rx="18" fill="#EF4444" fill-opacity="0.2"/>
  <text x="680" y="494" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="14" fill="#F87171">GST</text>
  <!-- URL -->
  <text x="80" y="560" font-family="Inter, system-ui, sans-serif" font-weight="500" font-size="18" fill="#64748B">bahikhata.pro</text>
  <!-- Dashboard mockup on right side -->
  <rect x="750" y="100" width="380" height="430" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <rect x="766" y="140" width="170" height="80" rx="12" fill="#1E3A5F"/>
  <rect x="944" y="140" width="170" height="80" rx="12" fill="#1A3D3A"/>
  <rect x="766" y="230" width="348" height="120" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <!-- Mini chart bars -->
  <rect x="790" y="310" width="20" height="30" rx="3" fill="#2563EB" fill-opacity="0.6"/>
  <rect x="820" y="295" width="20" height="45" rx="3" fill="#2563EB" fill-opacity="0.7"/>
  <rect x="850" y="300" width="20" height="40" rx="3" fill="#2563EB" fill-opacity="0.6"/>
  <rect x="880" y="280" width="20" height="60" rx="3" fill="#2563EB" fill-opacity="0.8"/>
  <rect x="910" y="290" width="20" height="50" rx="3" fill="#2563EB" fill-opacity="0.7"/>
  <rect x="940" y="270" width="20" height="70" rx="3" fill="#10B981" fill-opacity="0.8"/>
  <rect x="970" y="285" width="20" height="55" rx="3" fill="#10B981" fill-opacity="0.7"/>
  <rect x="1000" y="265" width="20" height="75" rx="3" fill="#10B981" fill-opacity="0.9"/>
  <!-- Stats in cards -->
  <text x="800" y="175" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="20" fill="white">₹12.4L</text>
  <text x="800" y="200" font-family="Inter, system-ui, sans-serif" font-weight="500" font-size="12" fill="#64748B">Revenue</text>
  <text x="978" y="175" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="20" fill="#34D399">+24%</text>
  <text x="978" y="200" font-family="Inter, system-ui, sans-serif" font-weight="500" font-size="12" fill="#64748B">Growth</text>
</svg>
